name: tests

on:
  pull_request:
    branches:
    - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0
      
      - name: Setup MySQL
        uses: mirromutth/mysql-action@v1.1
        with:
          mysql database: 'my_db' 
          mysql user: 'dev' 
          mysql password: devpass 

      - name: Create env file
        run: echo -e "export TT_SQL_HOST=127.0.0.1\nexport TT_SQL_PORT=3306\nexport TT_SQL_USER=dev\nexport TT_SQL_PASS=devpass\nexport 
         TT_SQL_DB=my_db\nTT_SQL_DO_TESTS=TABLES_WILL_BE_DROPPED\nexport TT_SERVER_DEFAULT_EMAIL_DOMAIN="@sanger.ac.uk" 
         \nexport TT_SERVER_COOKIE="nginxauth"\nexport TT_SERVER_LPDAP_SERVER=ldap-ro.internal.sanger.ac.uk
         \nexport TT_SERVER_LDAP_BIND_DN=uid=%s,ou=people,dc=sanger,dc=ac,dc=uk"  > .env.development.local

      - name: Setup environment
        uses: trevorlloydelliott/set-environment-variables@v1.0.0
        with:
          VARIABLE_NAME: TT_ENV=development

      - name: Setup Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test

      - name: Run tests with race detection
        run: make race