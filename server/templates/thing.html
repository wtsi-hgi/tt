<tr hx-target="this" hx-swap="outerHTML">
	<td>{{ .Name }}</td>
	<td>{{ .Address }}</td>
	<td>{{ .Type }}</td>
	<td>{{ .Reason }}</td>
	<td>{{ .Description }}</td>
	<td>{{ .Version }}</td>
	<td>{{ .RequestSource }}</td>
	<td>{{ .License }}</td>
	<td>{{ .URL }}</td>
	<td>{{ .DownloadMethod }}</td>
	<td>{{ .Remove.Format "2006-01-02" }}</td>
	<td>
		<button class="uk-button uk-button-danger" hx-delete="/rest/v1/auth/things/{{ .ID }}" hx-swap="swap:1s">
			Delete
		</button>
	</td>
	<td class="uk-text-nowrap">
		{{ if true}}
		<button class="uk-button uk-button-default"
			hx-delete="/rest/v1/auth/subscriber"
			hx-include="[ThingID: '{{ .ID }}']"
			hx-include="[name='Creator']"
			hx-headers='{"Accept": "text/html"}'>
			Unsubscribe
		</button>
		{{ else }}
		<button class="uk-button uk-button-secondary"
			hx-post="/rest/v1/auth/subscriber"
			hx-include="[ThingID: '{{ .ID }}']"
			hx-include="[name='Creator']"
			hx-headers='{"Accept": "text/html"}'>
			Subscribe
		</button>
		{{ end }}
	</td>
</tr>
